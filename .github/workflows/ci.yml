name: 2.0 Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DEMO_MODE: '1'
  PROVIDER_NETWORK_DISABLED: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GEMINI_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  KLING_API_KEY: ''

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install system FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:host
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm quality
      - run: pnpm prepare:package
      - run: pnpm electron:preflight
      - run: git diff --check

  desktop-preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: windows-2022
            target: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:host
      - run: pnpm build
      - run: pnpm prepare:package
      - run: pnpm electron:preflight
      - run: pnpm prepare:desktop-stage
      - name: Package macOS preflight
        if: runner.os == 'macOS'
        env:
          SKIP_NOTARIZE: '1'
        shell: bash
        run: |
          arch="${{ matrix.target == 'mac-x64' && 'x64' || 'arm64' }}"
          arch_flag="--${arch}"
          pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --mac --dir "$arch_flag" --publish never -c.mac.identity=- -c.mac.entitlements=resources/entitlements.adhoc.plist -c.mac.entitlementsInherit=resources/entitlements.adhoc.plist
          executable="$(find dist-electron -type f -path '*/AIGC 导演工作室.app/Contents/MacOS/AIGC 导演工作室' -print -quit)"
          test -n "$executable"
          AIGC_DIRECTOR_EXECUTABLE="$executable" pnpm desktop:launch-smoke
      - name: Package Windows x64 preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --win --x64 --dir --publish never --config.win.signAndEditExecutable=false
          $executable = Get-ChildItem dist-electron -Recurse -Filter 'AIGC 导演工作室.exe' | Select-Object -First 1
          if (-not $executable) { throw 'packaged executable not found' }
          $env:AIGC_DIRECTOR_EXECUTABLE = $executable.FullName
          pnpm desktop:launch-smoke
