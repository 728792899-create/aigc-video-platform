name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      unsigned_preflight:
        description: '只构建 ad-hoc/无受信任证书预检包（不得公开发布）'
        required: true
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DEMO_MODE: '1'
      DEMO_SILENT_TTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - run: npm run prepare:desktop
      - name: Verify macOS release credentials
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || !inputs.unsigned_preflight)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MAC_CSC_LINK" && test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
      - name: Verify Windows release credentials
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || !inputs.unsigned_preflight)
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Windows signing credentials are required' }
      - if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || !inputs.unsigned_preflight)
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || !inputs.unsigned_preflight)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never
      - if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.unsigned_preflight
        env:
          SKIP_NOTARIZE: '1'
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.entitlements=resources/entitlements.adhoc.plist -c.mac.entitlementsInherit=resources/entitlements.adhoc.plist
      - if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml

  publish-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: gh release create "${GITHUB_REF_NAME}" release-assets/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
