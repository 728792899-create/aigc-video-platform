name: Signed Desktop Release

on:
  workflow_dispatch:
    inputs:
      unsigned_preflight:
        description: '仅生成内部未签名预检包'
        type: boolean
        default: true
        required: true
  push:
    tags: ['v2.*']

permissions:
  contents: write

env:
  DEMO_MODE: '1'
  PROVIDER_NETWORK_DISABLED: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            artifact: macos-intel
          - os: macos-14
            arch: arm64
            artifact: macos-apple-silicon
          - os: windows-2022
            arch: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:host
      - run: pnpm quality
      - run: pnpm prepare:package
      - run: pnpm electron:preflight
      - run: pnpm prepare:desktop-stage
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS' && (github.event_name == 'push' || !inputs.unsigned_preflight)
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build signed macOS package
        if: runner.os == 'macOS' && (github.event_name == 'push' || !inputs.unsigned_preflight)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm release:verify-credentials && pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --mac --${{ matrix.arch }} --publish never
      - name: Build unsigned macOS preflight
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.unsigned_preflight
        env:
          SKIP_NOTARIZE: '1'
        run: pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --mac --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.entitlements=resources/entitlements.adhoc.plist -c.mac.entitlementsInherit=resources/entitlements.adhoc.plist
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ('${{ github.event_name }}' -eq 'push' -or '${{ inputs.unsigned_preflight }}' -eq 'false') {
            pnpm release:verify-credentials
            pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --win --x64 --publish never
          } else {
            pnpm exec electron-builder --projectDir .desktop-stage -c.electronDist=../node_modules/electron/dist --win --x64 --publish never --config.win.signAndEditExecutable=false
          }
      - name: Verify signed macOS package
        if: runner.os == 'macOS' && (github.event_name == 'push' || !inputs.unsigned_preflight)
        shell: bash
        run: |
          app="$(find dist-electron -type d -name 'AIGC 导演工作室.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Verify signed Windows package
        if: runner.os == 'Windows' && (github.event_name == 'push' || !inputs.unsigned_preflight)
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-electron -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'signed installer not found' }
          signtool verify /pa /v $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
